format_name: pyi
format_version: "1.0"
description: "Python type stub (.pyi) annotations — use alongside pybind11 bindings"
language: python
extension: .pyi

unsupported_types:
  - CFStringRef
  - OSType

type_mappings:
  "int": "int"
  "unsigned int": "int"
  "long": "int"
  "unsigned long": "int"
  "short": "int"
  "unsigned short": "int"
  "int8_t": "int"
  "int16_t": "int"
  "int32_t": "int"
  "int64_t": "int"
  "uint8_t": "int"
  "uint16_t": "int"
  "uint32_t": "int"
  "uint64_t": "int"
  "size_t": "int"
  "float": "float"
  "double": "float"
  "bool": "bool"
  "std::string": "str"
  "char *": "str"
  "std::string_view": "str"
  "long long": "int"
  "unsigned long long": "int"
  "std::size_t": "int"
  "char": "str"
  "const char *": "str"
  "void": "None"
  "unsigned char": "int"
  "signed char": "int"
  "void *": "object"
  # Containers converted by pybind11/stl.h
  "std::vector<{T}>": "list[{T}]"
  "std::array<{T}, {N}>": "list[{T}]"
  "std::list<{T}>": "list[{T}]"
  "std::deque<{T}>": "list[{T}]"
  "std::set<{T}>": "set[{T}]"
  "std::unordered_set<{T}>": "set[{T}]"
  "std::map<{K}, {V}>": "dict[{K}, {V}]"
  "std::unordered_map<{K}, {V}>": "dict[{K}, {V}]"
  "std::pair<{A}, {B}>": "tuple[{A}, {B}]"
  "std::tuple<{Ts...}>": "tuple[{Ts...}]"
  "std::tuple<>": "tuple[()]"
  "std::optional<{T}>": "{T} | None"
  "std::variant<{Ts...}>": "{Ts... | }"
  "std::function<{R}({Args...})>": "Callable[[{Args...}], {R}]"
  "std::function<{R}()>": "Callable[[], {R}]"
  "std::shared_ptr<{T}>": "{T}"
  "std::unique_ptr<{T}>": "{T}"
  # Fallbacks: drop C++ qualifiers and namespaces so class types use their stub names
  "const {T}": "{T}"
  "{T} &": "{T}"
  "{T} &&": "{T}"
  "{T} *": "{T} | None"
  "{NS}::{T}": "{T}"

# C++ operator → Python dunder method; keep in sync with pybind11.output.yml so
# the stubs describe the bound methods (unmapped operators are not stubbed)

operator_mappings:
  "operator+": "__add__"
  "operator+unary": "__pos__"
  "operator-": "__sub__"
  "operator-unary": "__neg__"
  "operator*": "__mul__"
  "operator/": "__truediv__"
  "operator%": "__mod__"
  "operator+=": "__iadd__"
  "operator-=": "__isub__"
  "operator*=": "__imul__"
  "operator/=": "__itruediv__"
  "operator%=": "__imod__"
  "operator&": "__and__"
  "operator|": "__or__"
  "operator^": "__xor__"
  "operator~": "__invert__"
  "operator&=": "__iand__"
  "operator|=": "__ior__"
  "operator^=": "__ixor__"
  "operator==": "__eq__"
  "operator!=": "__ne__"
  "operator<": "__lt__"
  "operator<=": "__le__"
  "operator>": "__gt__"
  "operator>=": "__ge__"
  "operator<<": "__repr__"
  "operator>>": "__rshift__"
  "operator[]": "__getitem__"
  "operator()": "__call__"
  "operator!": "__bool__"
  "operator bool": "__bool__"
  "operator int": "__int__"
  "operator long": "__int__"
  "operator long long": "__int__"
  "operator float": "__float__"
  "operator double": "__float__"
  "operator std::string": "__str__"
  "operator size_t": "__index__"

template_file: "pyi.output.tpl"
